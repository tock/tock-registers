[package]
name = "structs2regs"
version = "0.1.0"
authors.workspace = true
edition.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "parsing", "printing", "extra-traits", "visit"] }
